# kind / k3d development values.
#
#   kind load docker-image urumi/gateway:0.1.0 urumi/woocommerce-mcp:0.1.0 \
#     urumi/inventory-mcp:0.1.0 urumi/support-mcp:0.1.0 urumi/dashboard:0.1.0 \
#     postgres:17-alpine node:26.7-alpine --name urumi-local
#   helm upgrade --install urumi infra/helm/mcp-gateway \
#     -n urumi --create-namespace \
#     -f infra/helm/mcp-gateway/values-local.yaml
#
# Everything here is development-only. The values below are placeholders, not
# credentials; real credentials never live in git (see values-prod.yaml for
# how production supplies them).

gateway:
  service:
    type: NodePort
    nodePort: 30081
  # What an external MCP client can actually reach: the gateway NodePort.
  # Feeds GET /api/settings → the dashboard's Settings page.
  publicUrl: "http://127.0.0.1:30081"

dashboard:
  service:
    type: NodePort
    nodePort: 30080
  # In-cluster proxy so a single port-forward to the dashboard serves /api too.
  gatewayUpstream: "http://gateway:8080"

postgres:
  persistence:
    size: 1Gi

secrets:
  create: true
  data:
    POSTGRES_PASSWORD: "local-dev-only-postgres-password"
    MCP_APP_DB_PASSWORD: "local-dev-only-app-role-password"
    MIGRATE_DATABASE_URL: "postgresql://postgres:local-dev-only-postgres-password@postgres:5432/mcp_gateway"
    DATABASE_URL: "postgresql://mcp_gateway_app:local-dev-only-app-role-password@postgres:5432/mcp_gateway"
    API_KEY_PEPPER: "local-dev-only-pepper-not-a-real-secret"
    WOOCOMMERCE_CONSUMER_KEY: "ck_local_dev_placeholder"
    WOOCOMMERCE_CONSUMER_SECRET: "cs_local_dev_placeholder"
    WORDPRESS_DB_PASSWORD: "local-dev-only-wp-app-password"
    WORDPRESS_DB_ROOT_PASSWORD: "local-dev-only-mariadb-root-password"
    WORDPRESS_ADMIN_PASSWORD: "local-dev-only-wp-admin-password"

mockStore:
  enabled: true

# Real WooCommerce store for the demo lab: WordPress + MariaDB in-cluster,
# seeded by the wp-cli init container (sample catalog, demo orders, and this
# release's WOOCOMMERCE_CONSUMER_KEY installed as a WooCommerce API key).
woocommerceMcp:
  storeMode: "real"

wordpress:
  enabled: true
  # Port-forward address of the storefront (see README "Demo walkthrough"):
  #   kubectl -n urumi port-forward svc/wordpress 8082:80
  siteUrl: "http://127.0.0.1:8082"

wordpressDb:
  persistence:
    size: 1Gi
