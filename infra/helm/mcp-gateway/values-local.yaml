# kind / k3d development values.
#
#   kind load docker-image urumi/gateway:0.1.0 urumi/woocommerce-mcp:0.1.0 \
#     urumi/inventory-mcp:0.1.0 urumi/support-mcp:0.1.0 urumi/dashboard:0.1.0 \
#     postgres:17-alpine node:26.7-alpine --name urumi-local
#   helm -n ingress-nginx upgrade --install ingress-nginx \
#     ingress-nginx/ingress-nginx --version 4.15.1 --create-namespace
#   helm upgrade --install urumi infra/helm/mcp-gateway \
#     -n urumi --create-namespace \
#     -f infra/helm/mcp-gateway/values-local.yaml
#
# Everything here is development-only. The values below are placeholders, not
# credentials; real credentials never live in git (see values-prod.yaml for
# how production supplies them).

gateway:
  service:
    type: NodePort
    nodePort: 30081
  # What an external MCP client can actually reach: the ingress host (stable
  # local domain, docs/README "Local ingress"). Falls back to a port-forward
  # of svc/gateway when the ingress controller is not running. Feeds
  # GET /api/settings → the dashboard's Settings page.
  publicUrl: "http://dashboard.urumi.test:18080"
  # Local kind runs plain-http MCP services (ClusterIP, no TLS); D34's
  # registration policy allows http:// URLs so an admin can register a local
  # server from the dashboard. Production (values-prod) keeps https-only.
  dynamicUpstreamTlsPolicy: "allow-http"

dashboard:
  service:
    type: NodePort
    nodePort: 30080
  # In-cluster proxy so a single port-forward to the dashboard serves /api too.
  gatewayUpstream: "http://gateway:8080"

postgres:
  persistence:
    size: 1Gi

secrets:
  create: true
  data:
    POSTGRES_PASSWORD: "local-dev-only-postgres-password"
    MCP_APP_DB_PASSWORD: "local-dev-only-app-role-password"
    MIGRATE_DATABASE_URL: "postgresql://postgres:local-dev-only-postgres-password@postgres:5432/mcp_gateway"
    DATABASE_URL: "postgresql://mcp_gateway_app:local-dev-only-app-role-password@postgres:5432/mcp_gateway"
    API_KEY_PEPPER: "local-dev-only-pepper-not-a-real-secret"
    WOOCOMMERCE_CONSUMER_KEY: "ck_local_dev_placeholder"
    WOOCOMMERCE_CONSUMER_SECRET: "cs_local_dev_placeholder"
    WORDPRESS_DB_PASSWORD: "local-dev-only-wp-app-password"
    WORDPRESS_DB_ROOT_PASSWORD: "local-dev-only-mariadb-root-password"
    WORDPRESS_ADMIN_PASSWORD: "local-dev-only-wp-admin-password"

mockStore:
  enabled: true

# Real WooCommerce store for the demo lab: WordPress + MariaDB in-cluster,
# seeded by the wp-cli init container (sample catalog, demo orders, and this
# release's WOOCOMMERCE_CONSUMER_KEY installed as a WooCommerce API key).
woocommerceMcp:
  storeMode: "real"

# Local ingress (kind): an ingress-nginx controller is installed into the
# same cluster and reached through a port-forward (kind maps no host ports):
#   helm -n ingress-nginx upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --version 4.15.1 --create-namespace
#   kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 18080:80 &
# Then map the local domain (requires sudo; without it use
# `curl --resolve` / a browser host override — see README "Local ingress"):
#   127.0.0.1 dashboard.urumi.test shop.urumi.test
ingress:
  enabled: true
  className: nginx
  host: "dashboard.urumi.test"
  storefrontHost: "shop.urumi.test"

wordpress:
  enabled: true
  # Canonical storefront URL = the ingress host. The wp-init container rewrites
  # home/siteurl to this value on every boot (idempotent), so the storefront
  # renders with matching asset URLs and no redirect loop through the ingress.
  # The port is the ingress port-forward above (kind maps no host ports; :80
  # needs root). A bare port-forward of svc/wordpress 301-redirects here —
  # use it only for wp-login.php emergencies.
  siteUrl: "http://shop.urumi.test:18080"

wordpressDb:
  persistence:
    size: 1Gi
