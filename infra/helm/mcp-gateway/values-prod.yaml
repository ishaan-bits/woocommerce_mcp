# Production values template.
#
# This file deliberately contains NO credentials. An operator must:
#   1. push the five urumi images (immutable tags, e.g. 0.1.0) to their
#      registry and replace registry.example.com below,
#   2. create the Secret named in secrets.existingSecret with the required
#      keys listed in values.yaml (kubectl create secret generic …); add the
#      optional GROQ_API_KEY key too if the chat agent should be enabled —
#      without it the gateway boots identically and /api/chat answers 503,
#   3. set ingress.host to a real hostname and, for TLS, supply a certificate
#      before enabling ingress.tls,
#   4. confirm the cluster's default StorageClass (or set
#      postgres.persistence.storageClass) provides ReadWriteOnce volumes,
#   5. enable networkPolicy only on a CNI that enforces it.
# See infra/helm/README.md for exact commands.

logLevel: info

gateway:
  replicas: 2
  image:
    repository: registry.example.com/urumi/gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # With the Ingress in front of the dashboard's nginx, the client IP the
  # login throttle should key on is two hops back.
  trustProxy: 2
  # D33: "auto" already yields Secure whenever the edge serves HTTPS (ingress
  # sets X-Forwarded-Proto: https and TRUST_PROXY is on). Keep "auto" while
  # TLS is off — a Secure cookie over plain http is rejected by browsers and
  # would break login. Switch to "true" once ingress.tls is enforced.
  sessionCookieSecure: "auto"
  # Public origin of the deployment — rendered into GET /api/settings so the
  # dashboard prints correct MCP-client connection instructions.
  publicUrl: "https://mcp.example.com"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

woocommerceMcp:
  replicas: 1
  image:
    repository: registry.example.com/urumi/woocommerce-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Real store: the in-cluster WordPress deployment below (storeUrl is only
  # consulted when storeMode="real" and wordpress.enabled=false, i.e. an
  # externally hosted store).
  storeMode: "real"
  storeUrl: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

inventoryMcp:
  image:
    repository: registry.example.com/urumi/inventory-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

supportMcp:
  image:
    repository: registry.example.com/urumi/support-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

dashboard:
  replicas: 2
  image:
    repository: registry.example.com/urumi/dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
  # "" = the Ingress below owns /api and the dashboard serves its documented
  # 503 fallback instead of proxying (docs/architecture.md §8).
  gatewayUpstream: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

postgres:
  replicas: 1
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  persistence:
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mockStore:
  enabled: false

# The real store ships with the release: WordPress + MariaDB with pinned
# images, stateful PVCs and an idempotent wp-cli seed. The WordPress API is
# reachable only inside the namespace (ClusterIP), never through the Ingress.
wordpress:
  enabled: true
  # Replace with the public storefront origin if the store should be browsed
  # directly; keep it the Ingress/host-forward origin you actually serve.
  siteUrl: "https://mcp.example.com"
  adminEmail: "admin@example.com"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

wordpressDb:
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

secrets:
  create: false
  # Required: an externally created Secret containing all ten keys
  # (seven base + three WordPress: WORDPRESS_DB_PASSWORD,
  # WORDPRESS_DB_ROOT_PASSWORD, WORDPRESS_ADMIN_PASSWORD).
  existingSecret: "urumi-gateway-secrets"

ingress:
  enabled: true
  className: nginx
  # Placeholder hostname — replace with a real DNS name pointing at the
  # cluster's ingress controller.
  host: "mcp.example.com"
  # cert-manager (or your ACME tooling) can be wired here, e.g.
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  tls:
    # TLS is off until an operator supplies a real certificate: this project
    # does not provision public VPS certificates.
    enabled: false
    secretName: ""

networkPolicy:
  # Requires a CNI that enforces NetworkPolicy (Kind's kindnet does not).
  enabled: true
