{{/*
dashboard — nginx serving the built UI. GATEWAY_UPSTREAM (ConfigMap) makes
the pod proxy /api to the gateway by service DNS; when it is empty the
image's entrypoint writes the documented 503 fallback instead (an Ingress
then owns /api — docs/architecture.md §8).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
# C8 least privilege: the workload never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  GATEWAY_UPSTREAM: {{ .Values.dashboard.gatewayUpstream | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "mcp.selectorLabels" (dict "root" . "name" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "mcp.selectorLabels" (dict "root" . "name" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
        {{- include "mcp.selectorLabels" (dict "root" . "name" "dashboard") | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: dashboard
      securityContext:
        {{- include "mcp.podSecurityContext" . | nindent 8 }}
        # Numeric IDs matching the image's `USER nginx` — kubelet refuses named
        # users when runAsNonRoot is set.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: dashboard
          image: {{ printf "%s:%s" .Values.dashboard.image.repository .Values.dashboard.image.tag | quote }}
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "mcp.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
