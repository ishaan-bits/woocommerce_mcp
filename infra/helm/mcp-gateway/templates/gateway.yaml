{{/*
gateway — ServiceAccount, ConfigMap (non-sensitive config), Service and
Deployment. The Deployment runs migrations in an init container (tracked in
schema_migrations, so re-runs skip applied files) before the app starts.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
# C8 least privilege: the workload never talks to the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
data:
  GATEWAY_HOST: "0.0.0.0"
  GATEWAY_PORT: {{ .Values.gateway.service.port | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  TOOL_CACHE_TTL_MS: {{ .Values.gateway.toolCacheTtlMs | quote }}
  # Upstream MCP servers by Kubernetes service DNS (docs/architecture.md §8).
  WOOCOMMERCE_MCP_URL: "http://woocommerce-mcp:{{ .Values.woocommerceMcp.port }}/mcp"
  INVENTORY_MCP_URL: "http://inventory-mcp:{{ .Values.inventoryMcp.port }}/mcp"
  SUPPORT_MCP_URL: "http://support-mcp:{{ .Values.supportMcp.port }}/mcp"
  # Milestone 8 security controls (threat-model C4/C7/B1):
  # C4: only the three service DNS names may resolve to private ClusterIPs.
  UPSTREAM_ALLOWED_PRIVATE_HOSTS: {{ .Values.gateway.upstreamAllowedPrivateHosts | join "," | quote }}
  UPSTREAM_MAX_RESPONSE_BYTES: {{ .Values.gateway.upstreamMaxResponseBytes | quote }}
  UPSTREAM_MAX_CONCURRENT_CALLS: {{ .Values.gateway.upstreamMaxConcurrentCalls | quote }}
  # C7: per-key tool-call rate limit and request-body cap.
  RATE_LIMIT_CALLS_PER_MINUTE: {{ .Values.gateway.rateLimitPerMinute | quote }}
  RATE_LIMIT_BURST: {{ .Values.gateway.rateLimitBurst | quote }}
  JSON_BODY_LIMIT: {{ .Values.gateway.jsonBodyLimit | quote }}
  # B1/C7: failed-logins-per-IP throttle; trust proxy hops for client IPs
  # (1 = the dashboard's nginx; 2 when an Ingress sits in front of it).
  LOGIN_MAX_FAILURES_PER_IP: {{ .Values.gateway.loginMaxFailuresPerIp | quote }}
  LOGIN_FAILURE_WINDOW_MS: {{ .Values.gateway.loginFailureWindowMs | quote }}
  TRUST_PROXY: {{ .Values.gateway.trustProxy | quote }}
  # Milestone 9 chat agent (D29): non-sensitive provider settings only. The
  # provider key is NOT here — it is the optional GROQ_API_KEY key in the
  # Secret (env below). Absent key = agent disabled = 503 on POST /api/chat.
  GROQ_MODEL: {{ .Values.gateway.llm.model | quote }}
  LLM_REQUEST_TIMEOUT_MS: {{ .Values.gateway.llm.requestTimeoutMs | quote }}
  {{- if .Values.gateway.llm.baseUrl }}
  LLM_BASE_URL: {{ .Values.gateway.llm.baseUrl | quote }}
  {{- end }}
  # Milestone 10 (Phase A/B): display label for the woocommerce upstream —
  # which backing store the MCP was pointed at at deploy time. Purely
  # informational for GET /api/upstreams; never a runtime switch.
  WOOCOMMERCE_STORE_MODE: {{ required "woocommerceMcp.storeMode must be \"mock\" or \"real\"" .Values.woocommerceMcp.storeMode | quote }}
  # Public origin (scheme://host[:port], no path) for GET /api/settings
  # connection instructions. Omitted when unset: the endpoint then reports
  # an unknown endpoint instead of guessing localhost.
  {{- with .Values.gateway.publicUrl }}
  GATEWAY_PUBLIC_URL: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  # Keep streamable-HTTP MCP sessions on one gateway pod when replicas > 1.
  sessionAffinity: ClientIP
  selector:
    {{- include "mcp.selectorLabels" (dict "root" . "name" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.gateway.service.type "NodePort") .Values.gateway.service.nodePort }}
      nodePort: {{ .Values.gateway.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "mcp.selectorLabels" (dict "root" . "name" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
        {{- include "mcp.selectorLabels" (dict "root" . "name" "gateway") | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: gateway
      securityContext:
        {{- include "mcp.podSecurityContext" . | nindent 8 }}
        # Numeric IDs matching the image's `USER node` — kubelet refuses named
        # users when runAsNonRoot is set.
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # Waits for PostgreSQL and applies migrations. The runner tracks
        # applied files in schema_migrations, so this is safe on every pod
        # start; bounded retries handle PostgreSQL still initialising.
        - name: migrate
          image: {{ printf "%s:%s" .Values.gateway.image.repository .Values.gateway.image.tag | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until node dist/db/migrate.js; do
                i=$((i+1))
                if [ "$i" -ge {{ .Values.gateway.migrate.maxAttempts }} ]; then
                  echo "migrations failed after $i attempts" >&2
                  exit 1
                fi
                echo "waiting for postgres (attempt $i)" >&2
                sleep {{ .Values.gateway.migrate.sleepSeconds }}
              done
          env:
            - name: MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.secretName" . }}
                  key: MIGRATE_DATABASE_URL
            - name: MCP_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.secretName" . }}
                  key: MCP_APP_DB_PASSWORD
          securityContext:
            {{- include "mcp.containerSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      containers:
        - name: gateway
          image: {{ printf "%s:%s" .Values.gateway.image.repository .Values.gateway.image.tag | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            # DATABASE_URL is the least-privilege mcp_gateway_app role the
            # init container just created; the admin URL stays in the init
            # container only.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.secretName" . }}
                  key: DATABASE_URL
            - name: API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.secretName" . }}
                  key: API_KEY_PEPPER
            # Milestone 9 chat agent (threat-model L4 / D29): the Groq key is
            # an OPTIONAL key in the same Secret. optional: true means the pod
            # starts without it and the agent simply stays disabled — the
            # gateway never fails to boot over the chat feature, and the value
            # only ever exists in this container's env (never the ConfigMap,
            # never a response, never a log).
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp.secretName" . }}
                  key: GROQ_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- include "mcp.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
