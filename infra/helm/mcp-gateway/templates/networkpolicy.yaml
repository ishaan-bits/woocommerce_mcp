{{- if .Values.networkPolicy.enabled }}
{{/*
Namespace-internal ingress (threat-model.md C8): pods in this release accept
HTTP only from other pods in the same namespace; everything else — other
namespaces, LoadBalancers, node traffic — is denied on CNIs that enforce
NetworkPolicy.

Requires an enforcing CNI. VERIFIED 2026-10-26: kind v0.33's kindnet DOES
enforce NetworkPolicy (deny-all on one pod blocked same-namespace traffic in
a live probe; unselected pods unaffected). Enabling this policy therefore
works locally, BUT it also blocks cross-namespace traffic — add the ingress
controller's namespace via networkPolicy.allowIngressNamespaces or the
dashboard/storefront Ingress stops answering. Kubelet probes originate from
the node and are subject to the CNI's own node-traffic handling — verify
probe health after enabling.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-allow-in-namespace
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.allowIngressNamespaces | default (list) }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
{{- end }}
