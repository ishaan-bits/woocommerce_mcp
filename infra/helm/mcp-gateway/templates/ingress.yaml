{{- if .Values.ingress.enabled }}
{{/*
One host, two backends (docs/architecture.md §8): /mcp and /api → gateway,
/ → dashboard. When ingress.storefrontHost is set, a second host routes / to
the WordPress storefront (K6 / milestone 11 phase 3). TLS only renders when
an operator enabled it and supplied a certificate Secret — this chart does
not provision certificates.
*/}}
{{- if and .Values.ingress.storefrontHost (not .Values.wordpress.enabled) }}
{{- fail "ingress.storefrontHost requires wordpress.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when ingress.tls.enabled=true" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled=true (create/supply a real certificate)" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when ingress.enabled=true" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: {{ .Values.dashboard.service.port }}
    {{- if .Values.ingress.storefrontHost }}
    - host: {{ .Values.ingress.storefrontHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
    {{- end }}
{{- end }}
