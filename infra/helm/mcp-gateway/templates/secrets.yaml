{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp.secretName" . }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
type: Opaque
# stringData so local values stay readable in `helm template` output; the
# values themselves are development placeholders (values-local.yaml) — real
# credentials are never chart values at all (secrets.create=false +
# secrets.existingSecret, see values-prod.yaml).
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
