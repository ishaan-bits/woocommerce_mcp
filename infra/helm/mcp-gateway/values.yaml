# Shared defaults for the mcp-gateway chart.
#
# Environment separation lives entirely in values-local.yaml (kind/k3d) and
# values-prod.yaml (production). No real credentials are stored in this file
# or in any committed values file: sensitive values are read from a Kubernetes
# Secret (see the `secrets` block). Resource names are bare (gateway,
# postgres, …) exactly as docs/architecture.md §8 maps them, so upstream URLs
# are plain service DNS. Deploy one release per namespace.

logLevel: info

gateway:
  replicas: 1
  image:
    repository: urumi/gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  toolCacheTtlMs: 60000
  # --- Milestone 8 security controls (threat-model C4/C7/B1) ----------------
  # C4: hosts allowed to resolve to non-routable (ClusterIP) addresses. The
  # rendered gateway config points only at the three service DNS names.
  upstreamAllowedPrivateHosts:
    - woocommerce-mcp
    - inventory-mcp
    - support-mcp
  upstreamMaxResponseBytes: 10485760   # 10 MiB; 0 disables
  upstreamMaxConcurrentCalls: 8
  rateLimitPerMinute: 60               # per API key; 0 disables
  rateLimitBurst: 20
  jsonBodyLimit: "100kb"
  loginMaxFailuresPerIp: 10            # 0 disables
  loginFailureWindowMs: 300000
  # Trusted proxy hops for client-IP extraction (login throttle): 1 = the
  # dashboard's nginx; values-prod overrides to 2 when the Ingress sits first.
  trustProxy: 1
  # --- Milestone 9 chat agent (D29) -------------------------------------------
  # Non-sensitive LLM settings rendered into the gateway ConfigMap. The
  # provider key is NOT a chart value: it is the optional `GROQ_API_KEY` key
  # in the Secret (see the `secrets` block below). Without that key the agent
  # is disabled and POST /api/chat answers 503 agent_not_configured — the
  # gateway boots and every other feature works.
  llm:
    model: "openai/gpt-oss-120b"       # Groq free-tier default (README, D29)
    baseUrl: ""                        # "" = provider default (api.groq.com)
    requestTimeoutMs: 45000
  # The init container runs `node dist/db/migrate.js` until PostgreSQL accepts
  # connections; migrations are tracked in schema_migrations and re-runs skip.
  migrate:
    maxAttempts: 90
    sleepSeconds: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

woocommerceMcp:
  replicas: 1
  image:
    repository: urumi/woocommerce-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8081
  # Used only when mockStore.enabled=false: URL of the real WooCommerce store
  # (a URL, not a credential; the consumer key/secret come from the Secret).
  storeUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

inventoryMcp:
  replicas: 1
  image:
    repository: urumi/inventory-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8083
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

supportMcp:
  replicas: 1
  image:
    repository: urumi/support-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8084
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

dashboard:
  replicas: 1
  image:
    repository: urumi/dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # In-cluster gateway URL for the dashboard's /api nginx proxy (plain runtime
  # mode). Set to "" when an Ingress owns /api — nginx then serves the
  # documented 503 fallback instead of proxying.
  gatewayUpstream: "http://gateway:8080"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  user: postgres
  database: mcp_gateway
  persistence:
    size: 1Gi
    # "" uses the cluster's default StorageClass; set a class name to pin one.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Clearly-labelled mock WooCommerce store (services/woocommerce-mcp pattern)
# used for local demos. Disabled in values-prod.yaml — production injects a
# real store URL + credentials through the Secret.
mockStore:
  enabled: true
  image:
    repository: node
    tag: "26.7-alpine"
    pullPolicy: IfNotPresent
  port: 8090
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# One Secret holds every sensitive value. With create=true the chart renders
# it from `data` (development placeholders only — see values-local.yaml).
# Production sets create=false and points existingSecret at a Secret created
# outside the chart (kubectl create secret …, external-secrets, SOPS, …).
# Required keys: POSTGRES_PASSWORD, MCP_APP_DB_PASSWORD, MIGRATE_DATABASE_URL,
# DATABASE_URL, API_KEY_PEPPER, WOOCOMMERCE_CONSUMER_KEY,
# WOOCOMMERCE_CONSUMER_SECRET.
# Optional keys: GROQ_API_KEY (Milestone 9 chat agent; the gateway reads it
# with optional: true, so a Secret without this key boots the same gateway
# with the agent disabled). Real key material is never a chart value — see
# infra/helm/README.md "Enabling the chat agent" for the safe add/rotate
# commands.
secrets:
  create: false
  existingSecret: ""
  data: {}

# Ingress: routes one host — /mcp and /api → gateway, / → dashboard
# (docs/architecture.md §8). TLS is an integration point only: supply a real
# certificate (e.g. cert-manager) before enabling it.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Namespace-internal ingress rules (threat-model.md C8). Enable only on a CNI
# that enforces NetworkPolicy — Kind's kindnet does not.
networkPolicy:
  enabled: false
