# Shared defaults for the mcp-gateway chart.
#
# Environment separation lives entirely in values-local.yaml (kind/k3d) and
# values-prod.yaml (production). No real credentials are stored in this file
# or in any committed values file: sensitive values are read from a Kubernetes
# Secret (see the `secrets` block). Resource names are bare (gateway,
# postgres, …) exactly as docs/architecture.md §8 maps them, so upstream URLs
# are plain service DNS. Deploy one release per namespace.

logLevel: info

gateway:
  replicas: 1
  image:
    repository: urumi/gateway
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  toolCacheTtlMs: 60000
  # --- Milestone 8 security controls (threat-model C4/C7/B1) ----------------
  # C4: hosts allowed to resolve to non-routable (ClusterIP) addresses. The
  # rendered gateway config points only at the three service DNS names.
  upstreamAllowedPrivateHosts:
    - woocommerce-mcp
    - inventory-mcp
    - support-mcp
  upstreamMaxResponseBytes: 10485760   # 10 MiB; 0 disables
  upstreamMaxConcurrentCalls: 8
  rateLimitPerMinute: 60               # per API key; 0 disables
  rateLimitBurst: 20
  jsonBodyLimit: "100kb"
  loginMaxFailuresPerIp: 10            # 0 disables
  loginFailureWindowMs: 300000
  # Trusted proxy hops for client-IP extraction (login throttle): 1 = the
  # dashboard's nginx; values-prod overrides to 2 when the Ingress sits first.
  trustProxy: 1
  # Session-cookie Secure attribute policy (D33): "auto" adds Secure only
  # when the login request actually arrived over HTTPS (TRUST_PROXY +
  # X-Forwarded-Proto), so plain-HTTP local login also works in Safari/WebKit,
  # which rejects Secure cookies set over http even on localhost.
  # "true" / "false" force the attribute (set "true" once TLS is enforced).
  sessionCookieSecure: "auto"
  # --- Milestone 9 chat agent (D29) -------------------------------------------
  # Non-sensitive LLM settings rendered into the gateway ConfigMap. The
  # provider key is NOT a chart value: it is the optional `GROQ_API_KEY` key
  # in the Secret (see the `secrets` block below). Without that key the agent
  # is disabled and POST /api/chat answers 503 agent_not_configured — the
  # gateway boots and every other feature works.
  llm:
    model: "openai/gpt-oss-120b"       # Groq free-tier default (README, D29)
    baseUrl: ""                        # "" = provider default (api.groq.com)
    requestTimeoutMs: 45000
  # Externally reachable base URL of this gateway (no path) — rendered into
  # GATEWAY_PUBLIC_URL so GET /api/settings can print accurate MCP-client
  # connection instructions. "" = unknown: the endpoint then returns null and
  # the dashboard shows examples instead of inventing a URL.
  publicUrl: ""
  # The init container runs `node dist/db/migrate.js` until PostgreSQL accepts
  # connections; migrations are tracked in schema_migrations and re-runs skip.
  migrate:
    maxAttempts: 90
    sleepSeconds: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

woocommerceMcp:
  replicas: 1
  image:
    repository: urumi/woocommerce-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8081
  # Which backing store the woocommerce MCP points at, chosen AT DEPLOY TIME
  # (this chart writes it into both the MCP's WOOCOMMERCE_STORE_URL and the
  # gateway's WOOCOMMERCE_STORE_MODE display label together — it is never a
  # runtime switch and there is no silent fallback):
  #   "mock" → the in-cluster demo mock (requires mockStore.enabled=true)
  #   "real" → the in-cluster WordPress store when wordpress.enabled=true,
  #            otherwise the operator URL in woocommerceMcp.storeUrl
  storeMode: "mock"
  # Real store URL (a URL, not a credential; credentials always come from the
  # Secret). Used only when storeMode="real" and wordpress.enabled=false —
  # an externally hosted store, e.g. https://shop.example.com.
  storeUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

inventoryMcp:
  replicas: 1
  image:
    repository: urumi/inventory-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8083
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

supportMcp:
  replicas: 1
  image:
    repository: urumi/support-mcp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8084
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

dashboard:
  replicas: 1
  image:
    repository: urumi/dashboard
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # In-cluster gateway URL for the dashboard's /api nginx proxy (plain runtime
  # mode). Set to "" when an Ingress owns /api — nginx then serves the
  # documented 503 fallback instead of proxying.
  gatewayUpstream: "http://gateway:8080"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  user: postgres
  database: mcp_gateway
  persistence:
    size: 1Gi
    # "" uses the cluster's default StorageClass; set a class name to pin one.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Clearly-labelled mock WooCommerce store (services/woocommerce-mcp pattern)
# used for local demos. Disabled in values-prod.yaml — production uses the
# WordPress store below (or an external storeUrl) and injects credentials
# through the Secret.
mockStore:
  enabled: true
  image:
    repository: node
    tag: "26.7-alpine"
    pullPolicy: IfNotPresent
  port: 8090
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Real WooCommerce store inside the cluster: WordPress + MariaDB, seeded on
# first start by a wp-cli init container (sample products, two demo orders and
# the API key the woocommerce MCP authenticates with — idempotent, safe to
# re-run). Disabled by default; values-local.yaml enables it for demos.
wordpress:
  enabled: false
  image:
    repository: wordpress
    tag: "7.1.3-apache"
    pullPolicy: IfNotPresent
  # wp-cli image for the init container (runs the idempotent seed script).
  cliImage:
    repository: wordpress
    tag: "cli-2.11.0-php8.3"
    pullPolicy: IfNotPresent
  replicas: 1
  # Browser-facing storefront URL (siteurl/home). For the kind lab use the
  # port-forward address: kubectl -n urumi port-forward svc/wordpress 8082:80
  siteUrl: "http://127.0.0.1:8082"
  siteTitle: "URUMI demo store"
  adminUser: "admin"
  adminEmail: "admin@example.local"
  # Pinned versions installed by the init container (never :latest). The
  # coreVersion must satisfy the pinned WooCommerce release's
  # "Requires at least" — WooCommerce 11.2.1 needs WordPress ≥ 7.0.
  coreVersion: "7.1.3"
  woocommerceVersion: "11.2.1"
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# MariaDB backing the WordPress store (ClusterIP only, same pattern as
# postgres above; password material comes from the Secret).
wordpressDb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  database: wordpress
  user: wordpress
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# One Secret holds every sensitive value. With create=true the chart renders
# it from `data` (development placeholders only — see values-local.yaml).
# Production sets create=false and points existingSecret at a Secret created
# outside the chart (kubectl create secret …, external-secrets, SOPS, …).
# Required keys: POSTGRES_PASSWORD, MCP_APP_DB_PASSWORD, MIGRATE_DATABASE_URL,
# DATABASE_URL, API_KEY_PEPPER, WOOCOMMERCE_CONSUMER_KEY,
# WOOCOMMERCE_CONSUMER_SECRET, and — when wordpress.enabled=true —
# WORDPRESS_DB_PASSWORD, WORDPRESS_DB_ROOT_PASSWORD, WORDPRESS_ADMIN_PASSWORD.
# Optional keys: GROQ_API_KEY (Milestone 9 chat agent; the gateway reads it
# with optional: true, so a Secret without this key boots the same gateway
# with the agent disabled). Real key material is never a chart value — see
# infra/helm/README.md "Enabling the chat agent" for the safe add/rotate
# commands.
secrets:
  create: false
  existingSecret: ""
  data: {}

# Ingress: routes one host — /mcp and /api → gateway, / → dashboard
# (docs/architecture.md §8). TLS is an integration point only: supply a real
# certificate (e.g. cert-manager) before enabling it.
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Namespace-internal ingress rules (threat-model.md C8). Enable only on a CNI
# that enforces NetworkPolicy — Kind's kindnet does not.
networkPolicy:
  enabled: false
